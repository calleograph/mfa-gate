# Пример nginx для MFA Gate: два имени на одном reverse proxy.
#
#   mfa.example.org   — внутренний адрес (MFA_GATE_PUBLIC_URL): портал сотрудника /, панель /admin/,
#                       REST API /api/v1/, Device API, /assets/, /health/*. Только из внутренней сети и VPN.
#   auth.example.org  — внешний адрес (MFA_GATE_DEVICE_URL): только Device API /api/device/ для телефонов,
#                       которые должны достучаться до сервера ДО подключения VPN. Всё остальное — 404.
#
# MFA Gate слушает HTTP на 127.0.0.1:8080 (MFA_GATE_HTTP_BIND=127.0.0.1, MFA_GATE_HTTP_PORT=8080).
# Прокси на этом же сервере доверенный по умолчанию (MFA_GATE_TRUSTED_PROXIES=auto). Прокси на другом
# сервере: добавьте его адрес в MFA_GATE_TRUSTED_PROXIES и поменяйте 127.0.0.1:8080 ниже.
#
# Установка: скопировать в /etc/nginx/sites-available/mfa-gate, заменить имена, сети и пути к сертификатам,
# ln -s в sites-enabled, затем `nginx -t && systemctl reload nginx`. Файл подключается в контексте http.
# `http2 on` — nginx 1.25.1+; в старых версиях удалите строку и пишите `listen 443 ssl http2;`.
# `ssl_reject_handshake` — nginx 1.19.4+.

# Неизвестное имя (в том числе обращение по IP) — TLS-рукопожатие отклоняется.
# Без этого запрос с SNI внутреннего имени, пришедший снаружи, попал бы в первый server на порту 443.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80 default_server;
    return 444;
}

# Перенаправление на HTTPS для обоих имён. Если порт 80 снаружи закрыт, внешнему имени он не нужен
# (кроме проверки HTTP-01 при выпуске сертификата Let's Encrypt).
server {
    listen 80;
    server_name mfa.example.org auth.example.org;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------------------------
# Внутренний адрес: всё приложение.
# ---------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name mfa.example.org;

    # Сертификат внутреннего имени: корпоративный УЦ или Let's Encrypt с проверкой DNS-01
    # (HTTP-01 не сработает, если имя не видно из Интернета).
    ssl_certificate     /etc/ssl/mfa-gate/mfa.example.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/mfa-gate/mfa.example.org/privkey.pem;

    # Только внутренние сети и пул адресов VPN. Замените примеры своими сетями.
    # Это главная защита: серверная проверка Host (см. docs/network.md) закрывает только внешнее имя.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # перезаписать, не дописывать к значению клиента
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;                          # long-poll телефонов и REST API — до 30 с
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------------------------
# Внешний адрес: только Device API.
# ---------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name auth.example.org;

    # Телефон проверяет сертификат: нужен сертификат, которому доверяет Android (например, Let's Encrypt).
    ssl_certificate     /etc/ssl/mfa-gate/auth.example.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/mfa-gate/auth.example.org/privkey.pem;

    client_max_body_size 64k;   # запросы Device API — небольшие JSON
    access_log /var/log/nginx/mfa-gate-device.access.log;

    location /api/device/ {
        proxy_pass http://127.0.0.1:8080;
        # Host не менять: по нему MFA Gate отличает внешнее имя и отвечает 404 на всё, кроме Device API.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;                          # GET /api/device/v1/requests?wait=25 — не меньше 40 с
        proxy_buffering off;
    }

    # Портал, панель, REST API, OpenAPI, статика, проверки — снаружи не публикуются.
    location / {
        return 404;
    }
}
