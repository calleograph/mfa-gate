[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
markers =
    ldap: тесты на настоящем каталоге LDAP; нужен MFA_GATE_TEST_LDAP_URL (поднимает tests/ldap_fixture/run.sh)
    stack: сквозные тесты на развёрнутом стенде; нужен MFA_GATE_TEST_URL (поднимает scripts/e2e.sh)
