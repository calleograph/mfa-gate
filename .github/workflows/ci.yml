name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # release.yml запускает те же проверки перед выпуском

permissions:
  contents: read

jobs:
  private-data:
    name: Проверка на частные данные
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_private_data.py --self-test
      - run: python3 scripts/check_private_data.py

  server:
    name: Сервер — ruff, pytest, LDAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Виртуальное окружение
        run: python -m venv server/.venv && server/.venv/bin/pip install -r server/requirements-dev.txt
      - name: ruff
        run: server/.venv/bin/ruff check server
      - name: pytest (юнит-тесты)
        working-directory: server
        run: .venv/bin/pytest
      - name: pytest -m ldap (OpenLDAP в Docker)
        working-directory: server
        run: tests/ldap_fixture/run.sh

  e2e:
    name: Сквозной стенд (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Виртуальное окружение
        run: python -m venv server/.venv && server/.venv/bin/pip install -r server/requirements-dev.txt
      - name: scripts/e2e.sh
        run: scripts/e2e.sh
      - name: Результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: docs/test-results-e2e.txt
          if-no-files-found: ignore

  android:
    name: Android — тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # пакет tools удалён из SDK; платформы и build-tools AGP скачивает сам
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты и отладочные APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testFossDebugUnitTest :app:assembleFossDebug :app:assembleGmsDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mfa-gate-authenticator-debug
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
