name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Версии совпадают с тегом
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          server="$(sed -n 's/^ *version: str = "\([^"]*\)".*/\1/p' server/mfa_gate/config.py)"
          android="$(tr -d '[:space:]' < android/VERSION)"
          echo "тег: $tag, сервер: $server, android: $android"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::тег должен быть вида vX.Y.Z"; exit 1; }
          [[ "$server" == "$tag" ]] || { echo "::error::версия в server/mfa_gate/config.py ($server) не совпадает с тегом ($tag)"; exit 1; }
          [[ "$android" == "$tag" ]] || { echo "::error::android/VERSION ($android) не совпадает с тегом ($tag)"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  checks:
    name: Проверки CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Образ сервера
    needs: [verify, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mfa-gate" >> "$GITHUB_OUTPUT"   # ghcr требует нижний регистр
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          build-args: MFA_GATE_VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ steps.name.outputs.image }}:${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.title=mfa-gate
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

  apk:
    name: Подписанные APK
    needs: [verify, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MFA_GATE_KEYSTORE_B64: ${{ secrets.MFA_GATE_KEYSTORE_B64 }}
      MFA_GATE_KEYSTORE_PASSWORD: ${{ secrets.MFA_GATE_KEYSTORE_PASSWORD }}
      MFA_GATE_KEY_ALIAS: ${{ secrets.MFA_GATE_KEY_ALIAS }}
      MFA_GATE_KEY_PASSWORD: ${{ secrets.MFA_GATE_KEY_PASSWORD }}
    steps:
      - name: Секреты подписи заданы
        run: |
          missing=""
          for v in MFA_GATE_KEYSTORE_B64 MFA_GATE_KEYSTORE_PASSWORD MFA_GATE_KEY_ALIAS MFA_GATE_KEY_PASSWORD; do
            [[ -n "${!v}" ]] || missing="$missing $v"
          done
          if [[ -n "$missing" ]]; then
            echo "::error::нет секретов репозитория:$missing (Settings → Secrets and variables → Actions). Без них APK подписался бы отладочным ключом — выпуск остановлен."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # пакет tools удалён из SDK; платформы и build-tools AGP скачивает сам
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка release
        working-directory: android
        run: |
          umask 077
          printf '%s' "$MFA_GATE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MFA_GATE_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon :app:assembleFossRelease :app:assembleGmsRelease
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Подпись не отладочная, имена файлов
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          mkdir dist
          for flavor in foss gms; do
            apk="$(ls android/app/build/outputs/apk/$flavor/release/*.apk | head -n1)"
            certs="$("$apksigner" verify --print-certs "$apk")"
            if grep -q 'CN=Android Debug' <<<"$certs"; then echo "::error::$apk подписан отладочным ключом"; exit 1; fi
            cp "$apk" "dist/mfa-gate-authenticator-${{ needs.verify.outputs.version }}-$flavor.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [verify, image, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cd dist && sha256sum *.apk > SHA256SUMS && cd ..
          # описание выпуска — раздел версии из CHANGELOG.md
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "Выпуск $VERSION" > notes.md
          printf '\nОбраз сервера: `ghcr.io/%s/mfa-gate:%s`\n' "${GITHUB_REPOSITORY_OWNER,,}" "$VERSION" >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --title "MFA Gate $VERSION" --notes-file notes.md --verify-tag
