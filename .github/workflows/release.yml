name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Версии совпадают с тегом
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          server="$(sed -n 's/^ *version: str = "\([^"]*\)".*/\1/p' server/mfa_gate/config.py)"
          android="$(tr -d '[:space:]' < android/VERSION)"
          root="$(tr -d '[:space:]' < VERSION)"
          [[ "$root" == "${GITHUB_REF_NAME#v}" ]] || { echo "::error::VERSION ($root) не совпадает с тегом"; exit 1; }
          echo "тег: $tag, сервер: $server, android: $android"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::тег должен быть вида vX.Y.Z"; exit 1; }
          [[ "$server" == "$tag" ]] || { echo "::error::версия в server/mfa_gate/config.py ($server) не совпадает с тегом ($tag)"; exit 1; }
          [[ "$android" == "$tag" ]] || { echo "::error::android/VERSION ($android) не совпадает с тегом ($tag)"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  checks:
    name: Проверки CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Образ сервера
    needs: [verify, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mfa-gate" >> "$GITHUB_OUTPUT"   # ghcr требует нижний регистр
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          push: true
          build-args: MFA_GATE_VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ steps.name.outputs.image }}:${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.title=mfa-gate
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

  apk:
    name: APK
    needs: [verify, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Секреты подписи
        id: signing
        env:   # только наличие: сами значения видны лишь шагу сборки
          HAS_KS: ${{ secrets.MFA_GATE_KEYSTORE_B64 != '' }}
          HAS_KSP: ${{ secrets.MFA_GATE_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.MFA_GATE_KEY_ALIAS != '' }}
          HAS_KP: ${{ secrets.MFA_GATE_KEY_PASSWORD != '' }}
        run: |
          missing=""
          for v in HAS_KS HAS_KSP HAS_ALIAS HAS_KP; do
            [[ "${!v}" == true ]] || missing="$missing $v"
          done
          if [[ -n "$missing" ]]; then
            echo "::warning::нет секретов подписи MFA_GATE_KEYSTORE_B64/…_PASSWORD/KEY_ALIAS/KEY_PASSWORD — APK будут подписаны одноразовым ключом, выпуск предварительный"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'   # пакет tools удалён из SDK; платформы и build-tools AGP скачивает сам
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Сборка release (подписанная)
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        env:
          MFA_GATE_KEYSTORE_B64: ${{ secrets.MFA_GATE_KEYSTORE_B64 }}
          MFA_GATE_KEYSTORE_PASSWORD: ${{ secrets.MFA_GATE_KEYSTORE_PASSWORD }}
          MFA_GATE_KEY_ALIAS: ${{ secrets.MFA_GATE_KEY_ALIAS }}
          MFA_GATE_KEY_PASSWORD: ${{ secrets.MFA_GATE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$MFA_GATE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MFA_GATE_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon :app:assembleFossRelease :app:assembleGmsRelease
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Подпись не отладочная, имена файлов
        if: steps.signing.outputs.signed == 'true'
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          mkdir dist
          for flavor in foss gms; do
            apk="$(ls android/app/build/outputs/apk/$flavor/release/*.apk | head -n1)"
            certs="$("$apksigner" verify --print-certs "$apk")"
            if grep -q 'CN=Android Debug' <<<"$certs"; then echo "::error::$apk подписан отладочным ключом"; exit 1; fi
            cp "$apk" "dist/mfa-gate-authenticator-${{ needs.verify.outputs.version }}-$flavor.apk"
          done
      - name: Тестовые APK (без секретов подписи — одноразовый ключ)
        if: steps.signing.outputs.signed != 'true'
        working-directory: android
        run: |
          # release-сборка (не debuggable, только системные CA), подписанная ключом, который создаётся здесь и сразу удаляется:
          # обновить её поверх нельзя — для постоянного выпуска задайте секреты подписи
          umask 077
          export MFA_GATE_KEYSTORE="$RUNNER_TEMP/ephemeral.jks" MFA_GATE_KEY_ALIAS=test
          export MFA_GATE_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"; export MFA_GATE_KEY_PASSWORD="$MFA_GATE_KEYSTORE_PASSWORD"
          keytool -genkeypair -keystore "$MFA_GATE_KEYSTORE" -storetype PKCS12 -alias test -keyalg EC -groupname secp256r1 -validity 365 \
            -dname "CN=MFA Gate test build" -storepass "$MFA_GATE_KEYSTORE_PASSWORD" -keypass "$MFA_GATE_KEY_PASSWORD"
          ./gradlew --no-daemon :app:assembleFossRelease :app:assembleGmsRelease
          rm -f "$MFA_GATE_KEYSTORE"
          mkdir -p ../dist
          for flavor in foss gms; do
            cp "$(ls app/build/outputs/apk/$flavor/release/*.apk | head -n1)" \
              "../dist/mfa-gate-authenticator-${{ needs.verify.outputs.version }}-$flavor-TEST.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [verify, image, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cd dist && sha256sum *.apk > SHA256SUMS && cd ..
          # описание выпуска — раздел версии из CHANGELOG.md
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "Выпуск $VERSION" > notes.md
          printf '\nОбраз сервера: `ghcr.io/%s/mfa-gate:%s`\n' "${GITHUB_REPOSITORY_OWNER,,}" "$VERSION" >> notes.md
          prerelease=""
          if ls dist/*-TEST.apk >/dev/null 2>&1; then
            prerelease="--prerelease"
            printf '\n> **APK в этом выпуске — тестовые:** подписаны одноразовым ключом сборки. Для испытаний; следующую версию поверх них установить не получится — потребуется переустановка приложения и повторная привязка.\n' >> notes.md
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --title "MFA Gate $VERSION" --notes-file notes.md --verify-tag $prerelease
